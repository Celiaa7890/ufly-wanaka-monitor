name: U-Fly 60 availability monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a one-time phone notification without checking availability
        required: false
        type: boolean
        default: false

concurrency:
  group: ufly-availability-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check U-Fly availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 monitor.py
